{% extends "base.html" %}
{% block title %}Nowe zapotrzebowanie | Mini Hospital{% endblock %}
{% block content %}
    <h1>Nowe zapotrzebowanie</h1>
    <form action="/requests/create" method="post">
        <div>
            <label for="department">Oddział</label>
            <input type="text" id="department" name="department" required>
        </div>
        <div>
            <label for="item">Produkt</label>
            <input type="text" id="item" name="item" required>
        </div>
        <div>
            <label for="quantity">Ilość</label>
            <input type="number" id="quantity" name="quantity" min="1" required>
        </div>
        <button type="submit">Dodaj zapotrzebowanie</button>
    </form>
{% endblock %}
